server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 30s
  write_timeout: 30s

database:
  host: "localhost"
  port: 5432
  user: "tsukiyo"
  password: "tsukiyo_password"
  dbname: "tsukiyo"
  sslmode: "disable"
  max_conns: 20
  min_conns: 5

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 10

jwt:
  secret: "change_this_to_a_random_string_at_least_32_chars_long"
  expires_in: 24h

log:
  level: "info"
  format: "json"
  output_path: ""

agent:
  heartbeat_interval: 30s
  heartbeat_timeout: 60s
  task_timeout: 300s

# 安全：生产环境必须配置 jwt.secret 与 allowed_origins
security:
  # 浏览器跨域来源（管理端/用户端前端域名，含协议与端口）
  allowed_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
    - "http://localhost:5174"
  # 仅本地开发可设为 true；生产必须为 false
  allow_insecure_defaults: false
